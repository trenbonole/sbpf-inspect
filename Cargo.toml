[package]
name = "sbpf-inspect"
version = "0.3.0"
edition = "2024"
description = "Offline interface recovery for Solana sBPF programs: ELF facts, syscalls, strings and panic locations, corroborated Anchor instruction, account and event names, per-instruction account lists and argument layouts, and native instruction dispatch."
license = "MIT OR Apache-2.0"
keywords = ["solana", "sbpf", "reverse-engineering", "anchor", "idl"]
categories = ["development-tools", "wasm"]

[lib]
name = "sbpf_inspect"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sbpf-inspect"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.110", optional = true }

[features]
default = ["bindgen"]
# The JavaScript bindings of the WebAssembly build (wasm-pack). Without it, the WebAssembly build
# exports a plain interface with no imports instead (src/raw.rs).
bindgen = ["dep:wasm-bindgen"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
